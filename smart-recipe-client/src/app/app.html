<div class="app-container">
  <!-- Category View -->
  <app-category 
    *ngIf="currentView === 'category'"
    (categorySelected)="onCategorySelected($event)">
  </app-category>

  <!-- Products View -->
  <app-product-card 
    *ngIf="currentView === 'products'"
    [categoryId]="selectedCategory"
    (backToCategories)="onBackToCategories()"
    (generateRecipe)="onGenerateRecipe($event)">
  </app-product-card>

  <!-- Recipe View -->
  <app-quickly-recipe 
    *ngIf="currentView === 'recipe'"
    [recipe]="recipeResponse"
    [isLoading]="isLoading"
    [error]="error"
    (backToProducts)="onBackToProducts()"
    (createNewRecipe)="onCreateNewRecipe()">
  </app-quickly-recipe>
</div>
